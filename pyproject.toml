[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bem-testproblems"
version = "0.1.0.dev0"
description = "Reproducible continuous building energy optimization benchmarks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/bem_testproblems/data/licenses/*"]
authors = [{name = "Sustainable Urban Systems Lab"}]
dependencies = []

[project.optional-dependencies]
optimize = ["pdfo==2.2.0", "numpy>=1.26.4,<2", "scipy>=1.12,<2"]
replication = [
    "pdfo==2.2.0", "numpy>=1.26.4,<2", "scipy>=1.12,<2",
    "cma==4.4.2", "Py-BOBYQA==1.5.0", "pandas>=2,<3",
    "matplotlib>=3.8,<3.11", "contourpy>=1.0,<1.4",
]
replication-nlopt = ["nlopt==2.7.1"]
dev = ["pytest>=8,<10", "coverage>=7.6,<8", "ruff>=0.11,<1", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bem_testproblems = ["data/*.json", "data/licenses/*.txt", "data/modern/*.epJSON", "data/modern/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: invokes an externally installed EnergyPlus executable"]

[tool.coverage.run]
branch = true
source = ["src/bem_testproblems", "tools", "replication"]
data_file = ".validation-local/.coverage"

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
