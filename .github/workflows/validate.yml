name: Validate continuous benchmarks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_CLI_HOME: ${{ github.workspace }}/.tools/dotnet
  NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget

jobs:
  unit:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      VENV_PY: ${{ matrix.os == 'windows-2022' && '.venv/Scripts/python.exe' || '.venv/bin/python' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Create project-local environment
        run: |
          python -m venv .venv
          "$VENV_PY" -m pip install -c dependencies-py312.txt -e '.[dev,optimize,replication]'
      - name: Fetch checksum-pinned reference inputs
        run: '"$VENV_PY" tools/fetch_reference.py'
      - name: Install optional NLopt adapters for analytic tests
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: '"$VENV_PY" -m pip install -c dependencies-py312.txt -e ".[replication-nlopt]"'
      - name: Lint
        run: '"$VENV_PY" -m ruff check src tests tools replication examples'
      - name: Verify published replication packages
        run: '"$VENV_PY" replication/pipeline.py check-export'
      - name: Test behavior and measure branch coverage
        id: unit_tests
        run: |
          "$VENV_PY" -m coverage run -m pytest -m 'not integration' -q --junitxml=.validation-local/unit.xml
      - name: Report coverage for all Python modules and tools
        id: coverage_report
        if: >-
          always() && !cancelled() &&
          (steps.unit_tests.outcome == 'success' || steps.unit_tests.outcome == 'failure')
        run: |
          "$VENV_PY" -m coverage json --fail-under=0 -o .validation-local/reports/pytest-coverage.json
          "$VENV_PY" tools/check_coverage.py .validation-local/reports/pytest-coverage.json
          "$VENV_PY" -m coverage report
      - name: Retain coverage report
        if: >-
          always() && !cancelled() &&
          (steps.coverage_report.outcome == 'success' || steps.coverage_report.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-coverage-${{ matrix.os }}
          path: .validation-local/reports/pytest-coverage.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish concise failed-test annotations
        if: failure()
        run: |
          "$VENV_PY" tools/ci_failure_summary.py .validation-local/unit.xml
      - name: Build distribution
        if: runner.os == 'Linux'
        run: |
          "$VENV_PY" -m build

  original-csharp:
    name: ${{ matrix.weather_label }} C# versus Python (EnergyPlus 8.5)
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - weather_kind: canonical
            weather_label: Canonical
            cases: reference/canonical-cases.json
            baseline: reference/baselines/8.5.0-canonical.json
          - weather_kind: synthetic-ci
            weather_label: Supplemental synthetic
            cases: reference/cases.json
            baseline: ''
    env:
      ENERGYPLUS_VERSION: '8.5.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Create project-local environment
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -c dependencies-py312.txt -e '.[dev]'
      - name: Fetch checksum-pinned reference inputs
        run: .venv/Scripts/python.exe tools/fetch_reference.py
      - name: Install pinned EnergyPlus 8.5 core files
        run: .venv/Scripts/python.exe tools/install_reference_engine.py
      - name: Fetch checksum-verified canonical weather temporarily
        if: matrix.weather_kind == 'canonical'
        run: .venv/Scripts/python.exe tools/fetch_weather.py --directory .validation-local/weather
      - name: Generate supplemental analytic weather
        if: matrix.weather_kind == 'synthetic-ci'
        run: .venv/Scripts/python.exe tools/synthetic_weather.py --output-dir .validation-local/weather
      - name: Compile unchanged original components and evidence launcher
        run: |
          dotnet build reference/Oracle/Oracle.csproj -c Release -o .tools/reference-bin/oracle --nologo
          dotnet build reference/EngineProxy/EngineProxy.csproj -c Release -o .tools/reference-bin/proxy --nologo
          .tools/reference-bin/oracle/Oracle.exe --check-stubs
      - name: Compare successful values and rejected outcomes with the original implementation
        id: original_compare
        run: >-
          .venv/Scripts/python.exe tools/validate_cases.py
          --engine .tools/energyplus/$ENERGYPLUS_VERSION/energyplus.exe --version $ENERGYPLUS_VERSION
          --weather-dir .validation-local/weather --weather-kind ${{ matrix.weather_kind }}
          --cases ${{ matrix.cases }}
          --work-dir .validation-local/original-comparison
          --output .validation-local/reports/original-csharp.json
          --oracle .tools/reference-bin/oracle/Oracle.exe
          --proxy .tools/reference-bin/proxy/EngineProxy.exe
          ${{ matrix.baseline && format('--baseline {0}', matrix.baseline) || '' }}
      - name: Check the separate strict P1 extended-warmup model
        if: matrix.weather_kind == 'canonical'
        run: >-
          .venv/Scripts/python.exe tools/validate_cases.py
          --engine .tools/energyplus/$ENERGYPLUS_VERSION/energyplus.exe --version $ENERGYPLUS_VERSION
          --weather-dir .validation-local/weather --weather-kind canonical
          --cases reference/warmup-100-cases.json
          --work-dir .validation-local/warmup-100-comparison
          --output .validation-local/reports/warmup-100-regression.json
          --baseline reference/baselines/8.5.0-warmup-100-canonical.json
      - name: Reproduce actual failed searches and verify strict numerical repairs
        if: >-
          always() && !cancelled() && matrix.weather_kind == 'canonical' &&
          (steps.original_compare.outcome == 'success' || steps.original_compare.outcome == 'failure')
        run: >-
          .venv/Scripts/python.exe tools/validate_replication_failures.py
          --engine .tools/energyplus/$ENERGYPLUS_VERSION/energyplus.exe --version $ENERGYPLUS_VERSION
          --weather-dir .validation-local/weather
          --work-dir .validation-local/replication-failures
          --output .validation-local/reports/replication-failures.json
          --baseline reference/baselines/8.5.0-replication-failures.json
          --oracle .tools/reference-bin/oracle/Oracle.exe
          --proxy .tools/reference-bin/proxy/EngineProxy.exe
      - name: Check corrected warmup and historical HVAC models
        if: >-
          always() && !cancelled() && matrix.weather_kind == 'canonical' &&
          (steps.original_compare.outcome == 'success' || steps.original_compare.outcome == 'failure')
        run: >-
          .venv/Scripts/python.exe tools/validate_cases.py
          --engine .tools/energyplus/$ENERGYPLUS_VERSION/energyplus.exe --version $ENERGYPLUS_VERSION
          --weather-dir .validation-local/weather --weather-kind canonical
          --cases reference/corrected-model-cases.json
          --baseline reference/baselines/8.5.0-corrected-models.json
          --work-dir .validation-local/corrected-models
          --output .validation-local/reports/corrected-models.json
          --rtol 1e-4 --atol 1e-7
      - name: Retain numerical comparison report
        if: >-
          always() && !cancelled() &&
          (steps.original_compare.outcome == 'success' || steps.original_compare.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-csharp-${{ matrix.weather_kind }}
          path: |
            .validation-local/reports/original-csharp.json
            .validation-local/reports/warmup-100-regression.json
            .validation-local/reports/replication-failures.json
            .validation-local/reports/corrected-models.json
          include-hidden-files: true
          if-no-files-found: error

  modern-regression:
    name: ${{ matrix.weather_label }} EnergyPlus 26.2 value and diagnostic checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - weather_kind: canonical
            weather_label: Canonical
            cases: reference/canonical-cases.json
            baseline: reference/baselines/26.2.0-canonical.json
          - weather_kind: synthetic-ci
            weather_label: Supplemental synthetic
            cases: reference/cases.json
            baseline: reference/baselines/26.2.0-synthetic.json
    env:
      ENERGYPLUS_VERSION: '26.2.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Create project-local environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -c dependencies-py312.txt -e '.[dev]'
      - name: Install pinned EnergyPlus 26.2
        run: .venv/bin/python tools/install_energyplus.py
      - name: Fetch checksum-verified canonical weather temporarily
        if: matrix.weather_kind == 'canonical'
        run: .venv/bin/python tools/fetch_weather.py --directory .validation-local/weather
      - name: Generate supplemental analytic weather
        if: matrix.weather_kind == 'synthetic-ci'
        run: .venv/bin/python tools/synthetic_weather.py --output-dir .validation-local/weather
      - name: Compare values and rejected outcomes with reviewed references
        id: modern_compare
        run: >-
          .venv/bin/python tools/validate_cases.py
          --engine .tools/energyplus/$ENERGYPLUS_VERSION/energyplus --version $ENERGYPLUS_VERSION
          --weather-dir .validation-local/weather --weather-kind ${{ matrix.weather_kind }}
          --cases ${{ matrix.cases }}
          --work-dir .validation-local/modern-comparison
          --output .validation-local/reports/modern-regression.json
          --baseline ${{ matrix.baseline }}
      - name: Check exact repeatability of five midpoint cases
        if: >-
          always() && !cancelled() &&
          (steps.modern_compare.outcome == 'success' || steps.modern_compare.outcome == 'failure')
        run: >-
          .venv/bin/python tools/validate_cases.py
          --engine .tools/energyplus/$ENERGYPLUS_VERSION/energyplus --version $ENERGYPLUS_VERSION
          --weather-dir .validation-local/weather --weather-kind ${{ matrix.weather_kind }}
          --cases ${{ matrix.cases }}
          --work-dir .validation-local/modern-repeatability
          --output .validation-local/reports/modern-repeatability.json
          --baseline .validation-local/reports/modern-regression.json
          --case-id p01-midpoint --case-id p04-midpoint --case-id p06-midpoint
          --case-id p09-midpoint --case-id p13-midpoint --rtol 0 --atol 0
      - name: Reproduce actual failed searches and verify strict numerical repairs
        if: >-
          always() && !cancelled() && matrix.weather_kind == 'canonical' &&
          (steps.modern_compare.outcome == 'success' || steps.modern_compare.outcome == 'failure')
        run: >-
          .venv/bin/python tools/validate_replication_failures.py
          --engine .tools/energyplus/$ENERGYPLUS_VERSION/energyplus --version $ENERGYPLUS_VERSION
          --weather-dir .validation-local/weather
          --work-dir .validation-local/replication-failures
          --output .validation-local/reports/replication-failures.json
          --baseline reference/baselines/26.2.0-replication-failures.json
      - name: Check corrected warmup and historical HVAC models
        if: >-
          always() && !cancelled() && matrix.weather_kind == 'canonical' &&
          (steps.modern_compare.outcome == 'success' || steps.modern_compare.outcome == 'failure')
        run: >-
          .venv/bin/python tools/validate_cases.py
          --engine .tools/energyplus/$ENERGYPLUS_VERSION/energyplus --version $ENERGYPLUS_VERSION
          --weather-dir .validation-local/weather --weather-kind canonical
          --cases reference/corrected-model-cases.json
          --baseline reference/baselines/26.2.0-corrected-models.json
          --work-dir .validation-local/corrected-models
          --output .validation-local/reports/corrected-models.json
          --rtol 1e-4 --atol 1e-7
      - name: Retain numerical regression report
        if: >-
          always() && !cancelled() &&
          (steps.modern_compare.outcome == 'success' || steps.modern_compare.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modern-${{ matrix.weather_kind }}
          path: |
            .validation-local/reports/modern-regression.json
            .validation-local/reports/modern-repeatability.json
            .validation-local/reports/replication-failures.json
            .validation-local/reports/corrected-models.json
          include-hidden-files: true
          if-no-files-found: error
